spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/trade_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD}

logging:
  level:
    root: WARN
    com.example.trade: INFO
    org.springframework.ai: INFO