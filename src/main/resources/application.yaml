spring:
  application:
    name: xbot
  
  profiles:
    active: dev
  
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/trade_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
  
  # Spring AI 配置
  ai:
    alibaba:
      dashscope:
        api-key: ${DASHSCOPE_API_KEY}
        chat:
          options:
            model: qwen-turbo
            temperature: 0.7
            max-tokens: 1500
            top-p: 0.9
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  
  # Jackson 配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.trade.domain.*.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    cache-enabled: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      update-strategy: not_null

# Flyway 数据库版本管理
spring.flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true
  baseline-version: 0
  encoding: UTF-8
  validate-on-migrate: true

# 阿里云配置
aliyun:
  access-key-id: ${ALIYUN_ACCESS_KEY}
  access-key-secret: ${ALIYUN_ACCESS_SECRET}
  
  # OSS 配置
  oss:
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    bucket-name: trade-app-prod
    base-url: https://trade-app-prod.oss-cn-hangzhou.aliyuncs.com
  
  # OCR 配置
  ocr:
    endpoint: ocr.cn-shanghai.aliyuncs.com
    region-id: cn-shanghai
  
  # 向量数据库配置
  dashvector:
    api-key: ${DASHVECTOR_API_KEY}
    endpoint: https://vrs-cn-xxxx.dashvector.cn-hangzhou.aliyuncs.com
    collection: trade_knowledge

# 微信小程序配置
wechat:
  miniapp:
    app-id: ${WECHAT_APPID}
    app-secret: ${WECHAT_SECRET}
  
  # 微信支付配置
  pay:
    mch-id: ${WECHAT_MCH_ID}
    api-v3-key: ${WECHAT_PAY_KEY}
    private-key-path: classpath:cert/apiclient_key.pem
    merchant-serial-number: ${WECHAT_SERIAL_NO}
    notify-url: https://your-domain.com/api/payment/wechat/notify

# SPI 插件配置
app:
  spi:
    payment:
      default: wechat
      enabled-providers:
        - wechat
        - alipay
    logistics:
      default: sf
      enabled-providers:
        - sf
        - dhl
    erp:
      enabled: false

# 业务配置
business:
  ai:
    ocr:
      max-file-size: 10MB
      supported-types: jpg,png,pdf
    chat:
      cache-ttl: 3600
      max-history: 10
      max-tokens-per-day: 100000
  
  order:
    auto-cancel-minutes: 30
    auto-confirm-days: 7
    auto-comment-days: 15
  
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-in-production}
    expiration: 604800

# 日志配置
logging:
  level:
    root: INFO
    com.example.trade: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/trade-app.log
    max-size: 100MB
    max-history: 30

# Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true